name: Release

on:
  workflow_run:
    workflows:
      - Release checks
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Explicit stable version to release, such as 0.1.0 or v0.1.0.
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Resolve release version
        id: version
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"

          if [ -n "$VERSION_OVERRIDE" ]; then
            next_version="${VERSION_OVERRIDE#v}"
            if ! node -e "process.exit(/^0\\.[0-9]+\\.[0-9]+$/.test(process.argv[1]) ? 0 : 1)" "$next_version"; then
              echo "Version override must be a stable 0.x.y version: $VERSION_OVERRIDE" >&2
              exit 1
            fi
            echo "Using explicit version override: $next_version"
          else
            next_version="$(git-cliff --bumped-version | sed 's/^v//')"
          fi

          if [ -z "$next_version" ]; then
            echo "git-cliff did not infer a version" >&2
            exit 1
          fi

          if ! node -e "process.exit(/^0\\.[0-9]+\\.[0-9]+$/.test(process.argv[1]) ? 0 : 1)" "$next_version"; then
            echo "Release version must be a stable 0.x.y version: $next_version" >&2
            exit 1
          fi

          if [ -z "$VERSION_OVERRIDE" ] && [ "$next_version" = "$current_version" ]; then
            echo "git-cliff inferred $next_version, which matches package.json; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse --verify --quiet "v$next_version" >/dev/null; then
            if [ -n "$VERSION_OVERRIDE" ] &&
              [ "$next_version" = "$current_version" ] &&
              [ "$(git rev-parse "v$next_version^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "Resuming release v$next_version from its existing tag."
              echo "resume_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release tag v$next_version already exists" >&2
              exit 1
            fi
          else
            echo "resume_release=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "should_release=true"
            echo "version=$next_version"
            echo "tag=v$next_version"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.version.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Bump package version
        if: >-
          steps.version.outputs.should_release == 'true' &&
          steps.version.outputs.resume_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set version="$RELEASE_VERSION"
          npm pkg set version="$RELEASE_VERSION" --prefix packages/create-flamefront

      - name: Build
        if: steps.version.outputs.should_release == 'true'
        run: pnpm run --if-present build

      - name: Commit release updates
        if: >-
          steps.version.outputs.should_release == 'true' &&
          steps.version.outputs.resume_release != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/create-flamefront/package.json
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore(release): ${{ steps.version.outputs.tag }}"
          else
            git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          fi
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish Flamefront to npm with provenance
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(npm view "flamefront@$RELEASE_VERSION" version 2>/dev/null || true)" = "$RELEASE_VERSION" ]; then
            echo "flamefront@$RELEASE_VERSION is already published."
          else
            npm publish --provenance --access public
          fi

      - name: Publish create-flamefront to npm with provenance
        if: steps.version.outputs.should_release == 'true'
        working-directory: packages/create-flamefront
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(npm view "create-flamefront@$RELEASE_VERSION" version 2>/dev/null || true)" = "$RELEASE_VERSION" ]; then
            echo "create-flamefront@$RELEASE_VERSION is already published."
          else
            npm publish --provenance --access public
          fi
